<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-2000 Ultimate Blockbuster Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen pb-12">

    <div class="max-w-6xl mx-auto px-4 pt-8">
        
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-amber-400 via-rose-500 to-indigo-600 mb-3">
                🎬 Ultimate Post-2000 Blockbuster Tracker
            </h1>
            <p class="text-slate-400 text-lg">Kompletní seznam největších filmových hitů nového tisíciletí. Kolik jsi jich viděl?</p>
        </header>

        <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 mb-8 backdrop-blur-sm">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-2">
                <span class="text-slate-300 font-medium text-lg">Tvůj celkový pokrok:</span>
                <span id="progress-text" class="text-amber-400 font-bold text-xl">0 / 0 (0%)</span>
            </div>
            <div class="w-full bg-slate-700 rounded-full h-4 overflow-hidden shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-amber-500 via-rose-500 to-indigo-500 h-4 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-center">
            <div class="relative w-full md:w-96">
                <input type="text" id="search-input" placeholder="Hledat film podle názvu, roku nebo žánru..." 
                       class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 pl-10 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition">
                <span class="absolute left-3 top-3.5 text-slate-500">🔍</span>
            </div>

            <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700 w-full md:w-auto">
                <button onclick="setFilter('all')" id="filter-all" class="flex-1 md:flex-none px-5 py-2 rounded-lg font-medium text-sm transition bg-amber-600 text-white">Všechny</button>
                <button onclick="setFilter('seen')" id="filter-seen" class
