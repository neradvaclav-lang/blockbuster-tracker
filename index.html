        // Automatické zpracování textových dat na objekty
        const movies = rawMovies.map((item, idx) => {
            const parts = item.split('|');
            return { id: idx + 1, title: parts[0], year: parseInt(parts[1]), genre: parts[2] };
        });

        let seenMovieIds = JSON.parse(localStorage.getItem('seenMovies')) || [];
        let currentFilter = 'all';
        let searchQuery = '';

        const container = document.getElementById('movies-container');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const searchInput = document.getElementById('search-input');

        function renderMovies() {
            container.innerHTML = '';
            
            const filteredMovies = movies.filter(movie => {
                const matchesSearch = movie.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      movie.genre.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      movie.year.toString().includes(searchQuery);
                const isSeen = seenMovieIds.includes(movie.id);
                
                if (currentFilter === 'seen') return matchesSearch && isSeen;
                if (currentFilter === 'unseen') return matchesSearch && !isSeen;
                return matchesSearch;
            });

            if (filteredMovies.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500">Žádné filmy neodpovídají kritériím.</div>`;
                updateProgress();
                return;
            }

            filteredMovies.forEach(movie => {
                const isSeen = seenMovieIds.includes(movie.id);
                const card = document.createElement('div');
                
                card.className = `p-4 rounded-xl border transition cursor-pointer select-none flex items-center justify-between gap-4 group ${
                    isSeen 
                    ? 'bg-emerald-950/30 border-emerald-500/40 hover:bg-emerald-950/50 text-emerald-100' 
                    : 'bg-slate-800/70 border-slate-700/80 hover:border-slate-600 hover:bg-slate-800 text-slate-200'
                }`;
                
                card.onclick = () => toggleMovie(movie.id);
                const csfdSearchUrl = `https://www.csfd.cz/vyhledavani/?q=${encodeURIComponent(movie.title + ' ' + movie.year)}`;

                card.innerHTML = `
                    <div class="flex flex-col min-w-0 flex-1">
                        <span class="font-bold text-base leading-tight truncate group-hover:text-amber-400 transition">${movie.title}</span>
                        <span class="text-xs text-slate-400 mt-1 truncate">${movie.genre} • ${movie.year}</span>
                        <div class="mt-2">
                            <a href="${csfdSearchUrl}" target="_blank" onclick="event.stopPropagation();" 
                               class="inline-flex items-center text-[11px] font-semibold bg-slate-900/80 hover:bg-red-700 text-slate-300 hover:text-white px-2 py-1 rounded border border-slate-700 hover:border-red-600 transition duration-150">
                               ČSFD ↗
                            </a>
                        </div>
                    </div>
                    <div class="flex-shrink-0">
                        <div class="w-6 h-6 rounded-md border flex items-center justify-center transition duration-200 ${
                            isSeen 
                            ? 'bg-emerald-500 border-emerald-400 text-white shadow-lg shadow-emerald-900/50' 
                            : 'border-slate-500 bg-slate-900'
                        }">
                            ${isSeen ? '✓' : ''}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            updateProgress();
        }

        function toggleMovie(id) {
            if (seenMovieIds.includes(id)) {
                seenMovieIds = seenMovieIds.filter(movieId => movieId !== id);
            } else {
                seenMovieIds.push(id);
            }
            localStorage.setItem('seenMovies', JSON.stringify(seenMovieIds));
            renderMovies();
        }

        function updateProgress() {
            const total = movies.length;
            const seenCount = seenMovieIds.filter(id => movies.some(m => m.id === id)).length;
            const percentage = total > 0 ? Math.round((seenCount / total) * 100) : 0;

            progressText.innerText = `${seenCount} z ${total} filmů (${percentage}%)`;
            progressBar.style.width = `${percentage}%`;
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            ['all', 'seen', 'unseen'].forEach(type => {
                const btn = document.getElementById(`filter-${type}`);
                if (type === filterType) {
                    btn.className = "flex-1 md:flex-none px-5 py-2 rounded-lg font-medium text-sm transition bg-amber-600 text-white shadow-md";
                } else {
                    btn.className = "flex-1 md:flex-none px-5 py-2 rounded-lg font-medium text-sm transition text-slate-400 hover:text-slate-200";
                }
            });
            renderMovies();
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderMovies();
        });

        renderMovies();
